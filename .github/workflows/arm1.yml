name: arm1
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "recheck | collect | audit"
        default: "recheck"
      sample:
        description: cumulative PRs to collect (collect mode only)
        default: "20000"
      window:
        description: escape window in days
        default: "14"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 335
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas pyarrow numpy requests huggingface_hub
      - run: python tad_arm1.py --selftest
      # prs.sqlite is committed to the repo root and updated by the last step of every run.
      - name: recheck
        if: inputs.mode == 'recheck'
        run: python tad_arm1.py recheck --db prs.sqlite --window ${{ inputs.window }}
        env: { GITHUB_TOKEN: "${{ secrets.GH_PAT }}" }
      - name: collect
        if: inputs.mode == 'collect'
        run: python tad_arm1.py collect --out prs.sqlite --sample ${{ inputs.sample }} --window ${{ inputs.window }}
        env: { GITHUB_TOKEN: "${{ secrets.GH_PAT }}" }
      - name: audit
        if: inputs.mode == 'audit'
        run: python tad_arm1.py audit --db prs.sqlite --n 50 --window ${{ inputs.window }} | tee audit.csv
        env: { GITHUB_TOKEN: "${{ secrets.GH_PAT }}" }
      - run: python tad_arm1.py report --db prs.sqlite
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: prs-sqlite, path: "prs.sqlite\naudit.csv", if-no-files-found: ignore }
      - name: save progress to the repo
        if: always()
        run: |
          git config user.name "arm1-bot"
          git config user.email "arm1-bot@users.noreply.github.com"
          git add prs.sqlite
          git commit -m "arm1: save progress (${{ inputs.mode }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
